<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOE HAVEN - Checkout</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="images/Logo.webp" type="image/x-icon">

    <!-- Bootstrap Bundle JS (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

     <!-- Header -->
     <header>
        <div class="logo-container">
          <img src="images/Logo.webp" alt="Logo" class="logo">
          <span class="shop-name">SHOE HAVEN</span>
        </div>
        <nav>
          <ul class="nav justify-content-end">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product.html">Product</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="checkout.html">Checkout</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="wishlist.html">Wishlist</a>
            </li>            
          </ul>
        </nav>
      </header>

<!-- Main Content -->
<main class="container my-5">
  <!-- Checkout Table -->
  <div id="checkout-content">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="checkout-items"></tbody>
    </table>

    <div class="text-center">
        <h4>Total Amount: $<span id="total-amount-display">0.00</span></h4>
        <button class="btn btn-primary" id="finalize-order">Finalize Order</button>
    </div>
  </div>

  <!-- Success Message -->
  <div id="order-success" class="text-center" style="display: none;">
    <h3>Your order has been successfully submitted!</h3>
    <p>Thank you for shopping with us. You will receive a confirmation email shortly.</p>
    <button class="btn btn-success" onclick="window.location.href='index.html'">Go to Home</button>
  </div>
</main>

<script>
  const checkoutItemsContainer = document.getElementById('checkout-items');
  const totalAmountElement = document.getElementById('total-amount-display');
  const checkoutContent = document.getElementById('checkout-content');
  const orderSuccess = document.getElementById('order-success');

  function loadCheckoutItems() {
      const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
      let totalAmount = 0;

      cartItems.forEach(item => {
          const totalItemPrice = item.price * item.quantity;
          totalAmount += totalItemPrice;

          const row = document.createElement('tr');
          row.innerHTML = `
              <td>${item.name}</td>
              <td>$${item.price.toFixed(2)}</td>
              <td>${item.quantity}</td>
              <td>$${totalItemPrice.toFixed(2)}</td>
          `;
          checkoutItemsContainer.appendChild(row);
      });

      totalAmountElement.textContent = totalAmount.toFixed(2);
  }

  // Finalize order by sending cart details to the server
  document.getElementById('finalize-order').addEventListener('click', async () => {
      const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
      const totalAmount = parseFloat(totalAmountElement.textContent);

      if (cartItems.length === 0) {
          alert("No items in the cart!");
          return;
      }

      try {
          // Send data to the backend API for order processing
          const response = await fetch("http://localhost:5000/checkout", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ items: cartItems, totalAmount }),
          });

          const data = await response.json();

          if (response.ok) {
              // Order successfully placed, hide the checkout table and show success message
              checkoutContent.style.display = 'none';  // Hide checkout content
              orderSuccess.style.display = 'block';   // Show success message
              localStorage.removeItem('cartItems');   // Clear cart after successful order
          } else {
              alert("Error: " + data.message);
          }
      } catch (error) {
          console.error("Checkout Error:", error);
          alert("Something went wrong. Try again.");
      }
  });

  // Load cart items on page load
  loadCheckoutItems();
</script>

    <script src="js/script.js"></script>
    
    <footer class="text-center mt-5">
      <p>&copy; 2024 Shoe Haven. All Rights Reserved.</p>
  </footer>
</body>
</html>
