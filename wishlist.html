<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOE HAVEN - Wishlist</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="images/Logo.webp" type="image/x-icon">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
          <img src="images/Logo.webp" alt="Logo" class="logo">
          <span class="shop-name">SHOE HAVEN</span>
        </div>
        <nav>
          <ul class="nav justify-content-end">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product.html">Product</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="wishlist.html">Wishlist</a>
            </li>
          </ul>
        </nav>
    </header>

    <!-- Wishlist Content -->
    <main class="container my-5">
        <h2 class="text-center">My Wishlist</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="wishlist-items"></tbody>
        </table>
    </main>

    <script>
        const wishlistContainer = document.getElementById('wishlist-items');

        function loadWishlistItems() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            wishlistContainer.innerHTML = '';

            wishlist.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>$${item.price.toFixed(2)}</td>
                    <td><button class="btn btn-danger btn-sm remove-wishlist" data-product="${item.name}">Remove</button></td>
                `;
                wishlistContainer.appendChild(row);
            });

            // Attach event listeners for removing items
            document.querySelectorAll('.remove-wishlist').forEach(button => {
                button.addEventListener('click', () => {
                    const product = button.getAttribute('data-product');
                    removeFromWishlist(product);
                });
            });
        }

        function removeFromWishlist(productName) {
            let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
            wishlist = wishlist.filter(item => item.name !== productName);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            loadWishlistItems();
        }

        loadWishlistItems();
    </script>

    <footer class="text-center mt-5">
        <p>&copy; 2024 Shoe Haven. All Rights Reserved.</p>
    </footer>

</body>
</html>
