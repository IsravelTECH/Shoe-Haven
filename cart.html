<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOE HAVEN - Your Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="images/Logo.webp" type="image/x-icon">
    <!-- Bootstrap Bundle JS (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

     <!-- Header -->
     <header>
        <div class="logo-container">
          <img src="images/Logo.webp" alt="Logo" class="logo">
          <span class="shop-name">SHOE HAVEN</span>
        </div>
        <nav>
          <ul class="nav justify-content-end">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="product.html">Product</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="checkout.html">Checkout</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="wishlist.html">Wishlist</a>
            </li>            
          </ul>
        </nav>
      </header>

     
    <!-- Main Content -->
    <main class="container my-5">
      <table class="table table-bordered">
          <thead>
              <tr>
                  <th>Item</th>
                  <th>Price</th>
                  <th>Quantity</th>
                  <th>Total</th>
                  <th>Action</th> <!-- Column for updating quantity -->
              </tr>
          </thead>
          <tbody id="cart-items"></tbody>
      </table>
  
      <div class="text-center">
          <h4>Total Amount: $<span id="total-amount-display">0.00</span></h4>
          <button class="btn btn-primary" id="proceed-to-checkout">Proceed to Checkout</button>
          <button class="btn btn-danger" id="clear-cart">Clear Cart</button>
      </div>
  </main>

<script>
  const cartItemsContainer = document.getElementById('cart-items');
const totalAmountElement = document.getElementById('total-amount-display');

function loadCartItems() {
    const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
    let totalAmount = 0;
    cartItemsContainer.innerHTML = ''; // Clear existing cart items

    cartItems.forEach((item, index) => {
        const totalItemPrice = item.price * item.quantity;
        totalAmount += totalItemPrice;

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${item.name}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>
                <input type="number" class="quantity-input" value="${item.quantity}" min="1" data-index="${index}">
            </td>
            <td>$${totalItemPrice.toFixed(2)}</td>
            <td><button class="remove-item-btn" data-index="${index}">Remove</button></td>
        `;
        cartItemsContainer.appendChild(row);
    });

    totalAmountElement.textContent = totalAmount.toFixed(2);
}

// Handle Quantity Change
cartItemsContainer.addEventListener('input', function(e) {
    if (e.target.classList.contains('quantity-input')) {
        const index = e.target.getAttribute('data-index');
        const newQuantity = parseInt(e.target.value);
        updateItemQuantity(index, newQuantity);
    }
});

// Update the cart item quantity in localStorage
function updateItemQuantity(index, quantity) {
    const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
    const item = cartItems[index];
    if (item) {
        item.quantity = quantity; // Update quantity
        localStorage.setItem('cartItems', JSON.stringify(cartItems)); // Save updated cart
        loadCartItems(); // Reload the cart to reflect changes
    }
}

document.getElementById('proceed-to-checkout').addEventListener('click', () => {
    window.location.href = 'checkout.html';
});

document.getElementById('clear-cart').addEventListener('click', () => {
    localStorage.removeItem('cartItems');
    cartItemsContainer.innerHTML = '';
    totalAmountElement.textContent = '0.00';
    alert('Cart cleared!');
});

loadCartItems();

</script>


    <footer>
        <p>&copy; 2024 Shoe Haven. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
